<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="TradeOps Nexus — smarter strategy monitoring. Track spot, perpetual futures, and funding rate profits all in one place."
        />
        <meta name="theme-color" content="#07080c" />
        <!-- Social preview (absolute URLs: crawlers do not resolve relative paths) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="TradeOps Nexus" />
        <meta property="og:title" content="TradeOps Nexus — one dashboard for spot, perp &amp; funding-rate PnL" />
        <meta
            property="og:description"
            content="Track spot, perpetual-futures and funding-rate profit across nine venues and every wallet in one place."
        />
        <meta property="og:url" content="https://tradeops-nexus.onrender.com/" />
        <meta property="og:image" content="https://tradeops-nexus.onrender.com/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="TradeOps Nexus — live arbitrage PnL dashboard" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="TradeOps Nexus" />
        <meta
            name="twitter:description"
            content="Spot, perpetual-futures and funding-rate PnL from nine venues — live charts, spread tables and totals in one view."
        />
        <meta name="twitter:image" content="https://tradeops-nexus.onrender.com/og-image.png" />
        <title>TradeOps Nexus</title>
    </head>
    <body>
        <script>
            // Pre-paint theme bootstrap: set the theme class before first paint so
            // light-mode `nexus.*` surfaces apply immediately (no dark flash), and a
            // saved explicit choice always wins over the OS preference.
            (function () {
                try {
                    var stored = localStorage.getItem("theme");
                    var mode = stored === "light" || stored === "dark" ? stored : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                    document.body.classList.add(mode === "dark" ? "dark-theme" : "light");
                    document.documentElement.setAttribute("data-theme", mode);
                    document.documentElement.style.colorScheme = mode;
                } catch (e) {}
            })();
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
