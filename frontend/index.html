<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="TradeOps Nexus — smarter strategy monitoring. Track spot, perpetual futures, and funding rate profits all in one place."
        />
        <meta name="theme-color" content="#07080c" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <title>TradeOps Nexus</title>
    </head>
    <body>
        <script>
            // Pre-paint theme bootstrap: set the theme class before first paint so
            // light-mode `nexus.*` surfaces apply immediately (no dark flash), and a
            // saved explicit choice always wins over the OS preference.
            (function () {
                try {
                    var stored = localStorage.getItem("theme");
                    var mode = stored === "light" || stored === "dark" ? stored : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                    document.body.classList.add(mode === "dark" ? "dark-theme" : "light");
                    document.documentElement.setAttribute("data-theme", mode);
                    document.documentElement.style.colorScheme = mode;
                } catch (e) {}
            })();
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
